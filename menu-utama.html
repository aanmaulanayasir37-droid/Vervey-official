<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elcida - Menu Utama</title>
    <!-- Font Awesome untuk Icon Sosmed & Hamburger -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navbar */
        header {
            width: 100%;
            background-color: #0a0a0c;
            padding: 14px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a20;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .divider {
            color: #333;
            font-size: 16px;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-links a {
            color: #888888;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .nav-links a.active {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 2px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Main Section Menu Utama */
        .hero-section {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            overflow: hidden;
            min-height: calc(100vh - 55px);
            padding: 20px;
        }

        /* Watermark Top Left */
        .watermark {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 11px;
            color: #888888;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Background Text */
        .bg-text-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 1;
        }

        .bg-text {
            font-size: clamp(80px, 20vw, 220px);
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 6px;
            line-height: 0.85;
        }

        /* Content Card */
        .menu-card {
            position: relative;
            z-index: 2;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .menu-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .menu-card p {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 20px;
        }

        /* Menu Grid Buttons */
        .grid-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-item:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Floating Social Bar Kanan Bawah */
        .social-bar {
            position: fixed;
            right: 12px;
            bottom: 15px;
            background-color: rgba(230, 230, 230, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            padding: 16px 12px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .social-bar a {
            color: #111111;
            font-size: 20px;
            text-decoration: none;
            transition: transform 0.2s, color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social-bar a:hover {
            color: #555555;
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-left">
            <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <span class="divider">|</span>
            <span class="brand-logo">ELCIDA GALLERY</span>
        </div>
        
        <nav class="nav-links">
            <a href="menu-utama.html" class="active">Menu Utama</a>
            <a href="beranda.html">Beranda</a>
            <a href="galeri.html">Galeri Gambar</a>
            <a href="cerita.html">Cerita</a>
        </nav>
    </header>

    <!-- Main Section -->
    <main class="hero-section">
        <!-- Watermark Kiri Atas -->
        <div class="watermark">
            <i class="fa-regular fa-user"></i> @zyresukaisekai
        </div>

        <!-- Big Background Text Overlay -->
        <div class="bg-text-container">
            <div class="bg-text">MENU</div>
        </div>

        <!-- Menu Utama Card -->
        <div class="menu-card">
            <h2>MENU UTAMA</h2>
            <p>Pilih navigasi cepat di bawah ini:</p>

            <div class="grid-buttons">
                <a href="beranda.html" class="btn-item"><i class="fa-solid fa-house"></i> Beranda Showcase</a>
                <a href="galeri.html" class="btn-item"><i class="fa-solid fa-image"></i> Galeri Gambar</a>
                <a href="cerita.html" class="btn-item"><i class="fa-solid fa-book"></i> Cerita & Artikel</a>
                <a href="certs.html" class="btn-item"><i class="fa-solid fa-certificate"></i> Certs</a>
                <a href="developer.html" class="btn-item" style="border-color: #f1c40f; color: #f1c40f;"><i class="fa-solid fa-code"></i> Developer Mode</a>
            </div>
        </div>

        <!-- Floating Social Bar Kanan Bawah -->
        <div class="social-bar">
            <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" title="Twitter / X"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </main>

</body>
</html>
